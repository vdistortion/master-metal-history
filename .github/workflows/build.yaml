name: Build and Publish Latest Release

on:
  push:
    branches:
      - main
    paths:
      - '**.typ'
      - 'images/**'
      - 'fonts/**'
      - 'build.sh'
      - '.github/workflows/build.yaml'
      - '.github/release-notes.md'
  workflow_dispatch:

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm typst ghostscript git

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh --ci

      - name: Point latest source tag to this commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ref = 'tags/latest'
            const owner = context.repo.owner
            const repo = context.repo.repo

            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref,
                sha: context.sha,
                force: true,
              })
            } catch (error) {
              if (error.status !== 404) throw error

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/${ref}`,
                sha: context.sha,
              })
            }

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Владимир Марочкин — «Мастер» (2003)"
          body_path: .github/release-notes.md
          files: |
            Владимир Марочкин - Мастер (2003).pdf
            images/Poster.webp
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
