name: Build and Release Latest

on:
  push:
    branches:
      - main
    paths:
      - '**.typ'
      - 'images/**'
      - 'fonts/**'
      - 'build.sh'
      - 'format.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date_now=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm typst ghostscript git

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh --ci

      - name: Point latest source tag to this commit
        run: git push origin "+${GITHUB_SHA}:refs/tags/latest"

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Последняя сборка (${{ steps.date.outputs.date_now }})"
          body: |
            ### 🚀 Автоматическая сборка проекта
            Это актуальная версия цифрового издания книги. 

            **Что нового:**
            - Автоматическая компиляция из Typst-исходников.
            - Оптимизация размера PDF.
            - Обновление структуры.

            **Файлы:**
            - `book.pdf` — основная книга для чтения.
          files: book.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
